# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# Retries/concorrência reduzidos para evitar falsos positivos por rate limit
# (sobretudo em youtube.com, com dezenas de vídeos/canais checados na mesma execução).
max_retries = 6
retry_wait_time = 8
max_concurrency = 8
max_redirects = 10
accept = [200, 206, 301, 302, 303, 307, 308]

# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio
# anti-bot), mesmo com o perfil no ar (verificado manualmente com curl e UA de
# navegador real nesta sessão: HTTP 200). É o único domínio excluído.
exclude = [
    "^https://www\\.linkedin\\.com/",
]

# youtube.com pode bloquear/derrubar conexões quando recebe muitas requisições
# concorrentes na mesma execução. Reduzimos a concorrência só para esse host
# em vez de excluí-lo. Precisa vir depois das chaves de nível superior (é uma
# tabela TOML).
[hosts."www.youtube.com"]
concurrency = 2
